<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Job | Job Portal</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #00c6ff, #007bff);
            margin: 0;
            padding: 0;
        }
        .container{
            width: 420px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
        }
        h2{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        input, textarea{
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        textarea{
            height: 100px;
            resize: none;
        }
        button{
            width: 100%;
            padding: 10px;
            background: #28a745;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover{
            background: #1e7e34;
        }
        .back{
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }
        .back:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Post New Job</h2>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Enter Job Title" required>
        <input type="text" name="company" placeholder="Enter Company Name" required>
        <textarea name="description" placeholder="Enter Job Description" required></textarea>
        <button type="submit">Post Job</button>
    </form>

    <a href="/dashboard/" class="back">⬅ Back to Dashboard</a>
</div>

</body>
</html>

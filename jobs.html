<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Jobs | Job Portal</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .container{
            width: 80%;
            margin: 40px auto;
        }
        h2{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .job-card{
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        .job-title{
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
        }
        .company{
            color: #555;
            font-size: 15px;
        }
        .desc{
            margin-top: 10px;
            color: #333;
        }
        .btn-back{
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn-back:hover{
            background: #1e7e34;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>All Available Jobs</h2>

    {% for j in jobs %}
        <div class="job-card">
            <div class="job-title">{{ j.title }}</div>
            <div class="company">{{ j.company }}</div>
            <div class="desc">{{ j.description }}</div>
        </div>
    {% empty %}
        <p style="text-align:center;">No jobs available.</p>
    {% endfor %}
